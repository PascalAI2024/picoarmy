services:
  # ── Infrastructure ───────────────────────────────────────────

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-picoarmy}
      POSTGRES_USER: ${POSTGRES_USER:-commander}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commander} -d ${POSTGRES_DB:-picoarmy}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - picoarmy_net

  api:
    image: postgrest/postgrest
    restart: always
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-commander}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-picoarmy}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - picoarmy_net

  # ── Commander (Dashboard + Fleet API + SSE) ──────────────────

  commander:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      POSTGREST_URL: http://api:3000
      POSTGRES_DB: ${POSTGRES_DB:-picoarmy}
      POSTGRES_USER: ${POSTGRES_USER:-commander}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PICOBOT_MODEL: ${PICOBOT_MODEL:-glm-4.7-flash}
      PICOBOT_BIN: ${PICOBOT_BIN:-/usr/local/bin/picobot}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-}
      MINIMAX_ANTHROPIC_BASE: ${MINIMAX_ANTHROPIC_BASE:-}
      GLM_CODING_API_KEY: ${GLM_CODING_API_KEY:-}
      GLM_CODING_API_BASE: ${GLM_CODING_API_BASE:-}
      GLM_CODING_MODEL: ${GLM_CODING_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE: ${GROQ_API_BASE:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      COMMANDER_PROVIDER: ${COMMANDER_PROVIDER:-groq-qwen}
      COMMANDER_MODEL: ${COMMANDER_MODEL:-qwen/qwen3-32b}
    volumes:
      - ./src:/app/src
      - ./souls:/app/souls
      - ./swarms:/app/swarms
      - ./skills:/app/skills
      - ./mcp-servers.json:/app/mcp-servers.json
      - bot_data:/data
    depends_on:
      api:
        condition: service_started
    networks:
      - picoarmy_net

volumes:
  postgres_data:
  bot_data:

networks:
  picoarmy_net:
    name: picoarmy_net
